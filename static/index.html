<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudyMate - AI Study Assistant</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #eef2ff, #f8fafc);
            min-height: 100vh;
            padding: 30px 15px;
            color: #1e293b;
        }

        .container {
            max-width: 850px;
            margin: auto;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo {
            font-size: 48px;
            margin-bottom: 10px;
        }

        h1 {
            font-size: 36px;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #64748b;
            font-size: 17px;
        }

        .card {
            background: white;
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 10px;
        }

        textarea {
            width: 100%;
            min-height: 150px;
            padding: 15px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            resize: vertical;
            font-size: 16px;
            font-family: inherit;
            outline: none;
        }

        textarea:focus {
            border-color: #6366f1;
        }

        button {
            width: 100%;
            margin-top: 15px;
            padding: 14px;
            border: none;
            border-radius: 12px;
            background: #4f46e5;
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #4338ca;
        }

        button:disabled {
            background: #94a3b8;
            cursor: not-allowed;
        }

        .answer {
            white-space: pre-wrap;
            line-height: 1.7;
            color: #334155;
        }

        .loading {
            display: none;
            text-align: center;
            color: #6366f1;
            margin-top: 15px;
        }

        .examples {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 15px;
        }

        .example {
            width: auto;
            margin: 0;
            padding: 8px 12px;
            background: #eef2ff;
            color: #4338ca;
            font-size: 13px;
        }

        .example:hover {
            background: #e0e7ff;
        }

        footer {
            text-align: center;
            color: #64748b;
            font-size: 13px;
            margin-top: 20px;
        }
    </style>
</head>

<body>

<div class="container">

    <header>
        <div class="logo">📚</div>
        <h1>StudyMate</h1>
        <p class="subtitle">
            Your AI-powered study assistant
        </p>
    </header>

    <div class="card">

        <label for="question">
            What do you want to learn?
        </label>

        <textarea
            id="question"
            placeholder="Example: Explain polymorphism in C# with a simple example..."
        ></textarea>

        <div class="examples">
            <button class="example"
                onclick="setQuestion('Explain polymorphism in C# with a simple example.')">
                C# Polymorphism
            </button>

            <button class="example"
                onclick="setQuestion('Create 5 MCQs about database normalization.')">
                DBMS Quiz
            </button>

            <button class="example"
                onclick="setQuestion('Explain recursion in simple words with an example.')">
                Recursion
            </button>
        </div>

        <button id="askButton" onclick="askGemma()">
            ✨ Ask StudyMate
        </button>

        <div id="loading" class="loading">
            Gemma is thinking... ⏳
        </div>

    </div>

    <div class="card">
        <h2>💡 StudyMate's Answer</h2>
        <br>
        <div id="answer" class="answer">
            Your answer will appear here.
        </div>
    </div>

    <footer>
        Powered by Gemma • StudyMate
    </footer>

</div>

<script>

function setQuestion(text) {
    document.getElementById("question").value = text;
}

async function askGemma() {

    const question = document.getElementById("question").value.trim();
    const answer = document.getElementById("answer");
    const button = document.getElementById("askButton");
    const loading = document.getElementById("loading");

    if (!question) {
        answer.textContent = "Please enter a question first.";
        return;
    }

    button.disabled = true;
    loading.style.display = "block";
    answer.textContent = "";

    try {

        const response = await fetch("/api/ask", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                message: question
            })
        });

        const data = await response.json();

        if (!response.ok) {
            throw new Error(data.error || "Something went wrong.");
        }

        answer.textContent = data.answer;

    } catch (error) {

        answer.textContent =
            "Sorry, something went wrong. Please try again.";

        console.error(error);

    } finally {

        button.disabled = false;
        loading.style.display = "none";

    }
}

</script>

</body>
</html>
